<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F0F1F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Конспекты">
<title>Конспекты: менеджмент</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  color-scheme:light;
  --bg:#F0F1F3; --card:#FAFBFC; --ink:#1A1B1E; --ink-rgb:26,27,30;
  --accent:#45585F; --accent-soft:#C2CDCE; --on-accent:#FFFFFF;
  --c-1:#1C6A55; --v-dev:#1E7A5E; --v-dev-bg:rgba(28,106,85,.12);
  --v-fix-bg:rgba(200,154,60,.26); --v-fix:#936D25;
  --glass:rgba(240,241,243,.82);
  --shadow-float:0 4px 14px rgba(20,22,24,.08); --shadow-card:0 12px 36px rgba(20,22,24,.16);
  --sub:rgba(var(--ink-rgb),.62); --sub2:rgba(var(--ink-rgb),.47);
  --line:rgba(var(--ink-rgb),.11); --line-strong:rgba(var(--ink-rgb),.17);
  --track:rgba(var(--ink-rgb),.08); --hover:rgba(var(--ink-rgb),.04);
  --knob-bg:#FFFFFF;
  --hair:1px; --r-card:14px; --r-sm:9px; --r-pill:99px;
  --fs:17px;
  --font-serif:'Iowan Old Style',Baskerville,'Times New Roman',serif; --font-title:var(--font-serif);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,'Segoe UI',Roboto,sans-serif;
}
@media (min-resolution:2dppx){:root{--hair:.5px}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- главная ---------- */
.hero{padding:calc(env(safe-area-inset-top) + 36px) 4px 18px}
.kick{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
.hero h1{font-family:var(--font-title);font-size:38px;line-height:1.12;letter-spacing:-.018em;font-weight:400;margin:6px 0 6px}
.hero p{margin:0;color:var(--sub);font-size:15px}
.card{background:var(--card);border-radius:var(--r-card);box-shadow:0 0 0 var(--hair) var(--line)}
.stat{display:flex;gap:16px;align-items:center;padding:14px 16px;margin-top:16px}
.stat .num{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .num span{color:var(--sub);font-weight:400}
.bar{flex:1;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c-1);border-radius:99px}
.cont{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-top:10px;background:var(--accent);color:var(--on-accent);
  border-radius:var(--r-card);box-shadow:var(--shadow-float)}
.cont .t{flex:1;min-width:0}
.cont .l{font-size:12px;opacity:.8;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.cont .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont svg{flex:none}
.intro{padding:14px 16px;margin-top:10px;font-size:14px;color:var(--sub)}
.intro b{color:var(--ink);font-weight:600}

.search{position:sticky;top:0;z-index:5;padding:12px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;
  background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}
.search label{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:var(--r-pill);
  box-shadow:0 0 0 var(--hair) var(--line);padding:0 14px;min-height:44px;color:var(--sub)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none;padding:10px 0}
.search input::placeholder{color:var(--sub)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search .x{width:32px;height:32px;margin-right:-8px;display:none;align-items:center;justify-content:center;border-radius:99px;color:var(--sub)}
.search.has .x{display:flex}

.sec{margin:18px 0 0}
.sec h2{margin:0 4px 8px;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);display:flex;gap:8px}
.sec h2 .c{margin-left:auto;letter-spacing:0;font-variant-numeric:tabular-nums}
.sec .ttl{margin:0 4px 10px;font-family:var(--font-title);font-size:23px;line-height:1.2;letter-spacing:-.018em;font-weight:400}
.rows{overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;min-height:52px;position:relative}
.row+.row{box-shadow:inset 0 var(--hair) 0 var(--line)}
.row .no{flex:none;width:30px;color:var(--sub);font-variant-numeric:tabular-nums;font-size:15px;padding-top:1px}
.row .tx{flex:1;min-width:0;font-size:16px;line-height:1.35}
.row .tx small{display:block;color:var(--sub);font-size:13px;margin-top:3px}
.row .ckb{flex:none;margin:-12px -16px -12px 0;padding:12px 16px 12px 12px;display:flex;cursor:pointer}
.row .ck{flex:none;width:20px;height:20px;margin-top:1px;border-radius:99px;box-shadow:inset 0 0 0 1.5px var(--line-strong);
  display:flex;align-items:center;justify-content:center;color:#fff}
.row.done .ck{background:var(--c-1);box-shadow:none}
.row.done .tx{color:var(--sub)}
@media (hover:hover){.row:hover{background:var(--hover)}}
.res .tx small{font-size:14px;line-height:1.45;color:var(--sub)}
mark{background:var(--v-fix-bg);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:28px 16px;text-align:center;color:var(--sub)}
.foot{padding:28px 4px calc(env(safe-area-inset-bottom) + 32px);color:var(--sub2);font-size:13px;text-align:center}

/* ---------- статья ---------- */
.top{position:sticky;top:0;z-index:5;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);
  padding-top:env(safe-area-inset-top)}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:4px;height:52px;padding:0 6px}
.ib{display:flex;align-items:center;gap:2px;min-height:44px;min-width:44px;padding:0 10px;border-radius:99px;color:var(--accent);font-size:16px;font-weight:500}
.ib svg{flex:none}
.top .mid{flex:1;text-align:center;font-size:14px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .2s}
.top.sc .mid{opacity:1}
.prog{height:2px;background:transparent;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
.top.sc{box-shadow:0 var(--hair) 0 var(--line)}

.pop{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 50px);background:var(--card);border-radius:var(--r-card);
  box-shadow:var(--shadow-card),0 0 0 var(--hair) var(--line);padding:12px;width:236px;display:none;transform-origin:top right}
.pop.on{display:block}
.pop .lb{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sub);margin:0 2px 8px}
.seg{position:relative;display:flex;background:var(--track);border-radius:99px;padding:3px}
.seg button{position:relative;z-index:1;flex:1 1 0;min-width:0;height:38px;border-radius:99px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed=true]{color:var(--ink)}
.seg .knob{position:absolute;top:3px;bottom:3px;left:3px;border-radius:99px;background:var(--knob-bg);box-shadow:var(--shadow-float)}

article{padding:18px 4px 8px;font-size:var(--fs);line-height:1.62}
article .kick{display:block;margin-bottom:8px}
article h1{font-family:var(--font-title);font-size:calc(var(--fs) * 1.8);line-height:1.14;letter-spacing:-.018em;font-weight:400;margin:0 0 10px}
article h1 .hn{font-family:var(--font);font-weight:500;color:var(--sub);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
article .meta{color:var(--sub);font-size:14px;margin-bottom:22px;font-variant-numeric:tabular-nums}
article p{margin:0 0 .9em}
article b{font-weight:600}
article ul,article ol{margin:0 0 1.1em;padding:0}
article li{list-style:none;position:relative;padding-left:1.35em;margin:0 0 .55em}
article ul>li::before{content:"";position:absolute;left:.3em;top:.68em;width:.36em;height:.36em;border-radius:99px;background:var(--accent);opacity:.62}
article ol{counter-reset:n}
article ol>li{counter-increment:n;padding-left:1.9em}
article ol>li::before{content:counter(n);position:absolute;left:0;top:.18em;min-width:1.4em;height:1.4em;padding:0 .3em;border-radius:99px;
  background:var(--accent-soft);color:var(--ink);font-size:.72em;font-weight:600;line-height:1.4em;text-align:center;font-variant-numeric:tabular-nums}
article li ul{margin:.45em 0 .2em}
article li li{margin-bottom:.4em}
article li li::before{width:.5em!important;height:1.5px!important;border-radius:0!important;top:.8em!important;left:.25em!important;opacity:.5!important}
article ol.formulas>li{background:var(--card);box-shadow:0 0 0 var(--hair) var(--line);border-radius:var(--r-card);padding:14px 16px 14px 3.1em;margin-bottom:10px;
  font-variant-numeric:tabular-nums}
article ol.formulas>li::before{left:14px;top:16px}
article.facts ul>li{background:var(--card);box-shadow:0 0 0 var(--hair) var(--line);border-radius:var(--r-card);padding:12px 16px;margin-bottom:8px}
article.facts ul>li::before{display:none}
.flash{animation:fl 2.4s var(--ease,ease) both}
@keyframes fl{0%,60%{background:var(--v-fix-bg)}100%{background:transparent}}

.done-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin:14px 0 0;border-radius:var(--r-pill);
  background:var(--card);box-shadow:0 0 0 var(--hair) var(--line);font-weight:600;color:var(--ink)}
.done-btn.on{background:var(--v-dev-bg);box-shadow:none;color:var(--v-dev)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 0;padding-bottom:calc(env(safe-area-inset-bottom) + 28px)}
.nav a{display:block;padding:12px 14px;min-height:64px}
.nav a.nx{text-align:right;grid-column:2}
.nav .l{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--sub)}
.nav .n{font-size:15px;line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.press{will-change:transform}
@media (max-width:380px){.hero h1{font-size:30px}.row{padding:12px 14px}}
</style>
</head>

<script>
/* house-ui: движок пружин - единственная копия (SKILL.md, раздел 8).
   Одна страница - вставить первым в <script> до своего кода. */
/* RM - сам запрос, а не его .matches: «не двигать» спрашивается в момент
   движения, а не константой при загрузке (house-ui-audit, чек-лист 6в).
   До 25.09 здесь стоял .matches, и смена настройки на лету не доходила */
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)');
var SPRINGS=[],RAF=null,lastT=0;
function Spring(v,on,o){this.x=v;this.v=0;this.target=v;this.on=on;
  this.response=(o&&o.response)||0.4;this.damping=(o&&o.damping!=null)?o.damping:1;
  this.eps=(o&&o.eps)||0.05;this.active=false;this.onRest=null;}
Spring.prototype.set=function(t,o){o=o||{};this.target=t;
  if(o.velocity!=null)this.v=o.velocity;
  if(o.response)this.response=o.response;
  if(o.damping!=null)this.damping=o.damping;
  this.onRest=o.onRest||null;
  if((RM&&RM.matches)||o.immediate||document.hidden){this.jump(t);return this;}
  if(!this.active){this.active=true;SPRINGS.push(this);}
  kick();return this;};
/* Скрытая вкладка (26.09): в фоне пружина прыгает в цель, кадр, запрошенный
   и не отданный дольше 250 мс, запрашивается заново, возврат на вкладку
   перезапускает цикл - иначе Safari оставлял RAF занятым навсегда */
var rafAt=0;
function kick(){var n=performance.now();if(RAF&&n-rafAt<250)return;
  if(RAF)cancelAnimationFrame(RAF);rafAt=n;lastT=0;RAF=requestAnimationFrame(tickAll);}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){SPRINGS.slice().forEach(function(s){s.jump(s.target);});return;}
  if(SPRINGS.length){if(RAF)cancelAnimationFrame(RAF);RAF=null;kick();}});
Spring.prototype.jump=function(v){this.x=this.target=v;this.v=0;this.active=false;
  var i=SPRINGS.indexOf(this);if(i>-1)SPRINGS.splice(i,1);
  this.on(this.x);if(this.onRest){var f=this.onRest;this.onRest=null;f();}};
function tickAll(t){RAF=null;rafAt=0;var dt=lastT?Math.min(0.064,(t-lastT)/1000):0.016;lastT=t;
  for(var i=SPRINGS.length-1;i>=0;i--){var s=SPRINGS[i],
    k=Math.pow(2*Math.PI/s.response,2),c=4*Math.PI*s.damping/s.response,h=dt/4;
    for(var j=0;j<4;j++){s.v+=(-k*(s.x-s.target)-c*s.v)*h;s.x+=s.v*h;}
    if(Math.abs(s.v)<s.eps&&Math.abs(s.x-s.target)<s.eps){s.x=s.target;s.v=0;s.active=false;
      SPRINGS.splice(i,1);s.on(s.x);if(s.onRest){var f=s.onRest;s.onRest=null;f();}}
    else s.on(s.x);}
  if(SPRINGS.length){rafAt=performance.now();RAF=requestAnimationFrame(tickAll);}else lastT=0;}
function project(v,r){r=r||0.998;return (v/1000)*r/(1-r);}
function rubberband(over,dim,c){c=c||0.55;return (over*dim*c)/(dim+c*Math.abs(over));}

</script>
<script>
var D={"title":"Менеджмент 38.04.02","sub":"Конспект для вступительного экзамена в магистратуру 38.04.02 «Менеджмент»","intro":"Формат экзамена: 50 вопросов, 3 часа, 100 баллов. Из них: 30 - выбор ответа, 10 - открытый ответ, 5 - соответствие/последовательность, 5 - кейсы.","secs":[{"n":"1","t":"Теория менеджмента","a":["1.1","1.2","1.3","1.4","1.5","1.6"]},{"n":"2","t":"Стратегический менеджмент","a":["2.1","2.2","2.3","2.4","2.5","2.6"]},{"n":"3","t":"Производственный менеджмент","a":["3.1","3.2","3.3","3.4","3.5","3.6"]},{"n":"4","t":"Антикризисное управление","a":["4.1","4.2","4.3","4.4","4.5"]},{"n":"5","t":"Экономика предприятия","a":["5.1","5.2","5.3","5.4","5.5","5.6"]},{"n":"6","t":"Учет и анализ","a":["6.1","6.2","6.3","6.4","6.5","6.6"]},{"n":"7","t":"Методы принятия управленческих решений","a":["7.1","7.2","7.3","7.4","7.5"]},{"n":"8","t":"Формулы-шпаргалка для расчетных задач","a":["8"]},{"n":"9","t":"Быстрые факты для запоминания (частые ловушки теста)","a":["9"]}],"arts":[{"id":"1.1","s":"1","t":"Исторические этапы развития. Школы и концепции","h":"<p><b>Менеджмент</b> - вид профессиональной деятельности по управлению людьми и организацией для достижения целей путем рационального использования ресурсов. Как наука оформился в начале XX века (1911 г. - книга Ф. Тейлора «Принципы научного менеджмента»).</p><p>Школы менеджмента (учить с фамилиями - частый вопрос на соответствие):</p><ol><li><b>Школа научного управления (1885-1920)</b>: Ф. Тейлор, Ф. и Л. Гилбреты, Г. Гантт, Г. Эмерсон (12 принципов производительности), Г. Форд. Идеи: хронометраж и нормирование труда, отбор и обучение рабочих, отделение управленческого труда от исполнительского, сдельная оплата (материальное стимулирование).</li><li><b>Классическая (административная) школа (1920-1950)</b>: А. Файоль, М. Вебер (концепция рациональной бюрократии), Л. Урвик. Файоль выделил 5 функций управления (предвидение/планирование, организация, распорядительство, координация, контроль) и 14 принципов управления (разделение труда, единоначалие, дисциплина, скалярная цепь, справедливость, корпоративный дух и др.). Объект - организация в целом.</li><li><b>Школа человеческих отношений (1930-1950)</b>: Э. Мэйо (Хоторнские эксперименты), М. П. Фоллетт. Вывод: производительность зависит не только от денег, но и от социально-психологических факторов, внимания к работнику, отношений в группе (Хоторнский эффект).</li><li><b>Поведенческая (бихевиористская) школа (с 1950)</b>: Д. МакГрегор (теории X и Y), А. Маслоу, Ф. Герцберг, Р. Лайкерт, К. Арджирис. Фокус - мотивация, лидерство, раскрытие потенциала работника.</li><li><b>Количественная школа (с 1950)</b>: исследование операций, экономико-математические модели, кибернетика (Н. Винер, Р. Акофф).</li></ol><p>Современные подходы:</p><ul><li><b>Процессный</b> - управление есть непрерывная серия взаимосвязанных функций (планирование, организация, мотивация, контроль).</li><li><b>Системный</b> - организация как открытая система из взаимосвязанных элементов (входы - преобразование - выходы), взаимодействующая с внешней средой.</li><li><b>Ситуационный</b> - нет единственно правильного способа управления; выбор методов зависит от конкретной ситуации (ситуационных переменных).</li></ul>","m":1},{"id":"1.2","s":"1","t":"Функции менеджмента и уровни управления","h":"<p>Общие функции менеджмента:</p><ul><li><b>Планирование</b> - определение целей и путей их достижения (стратегическое, тактическое, оперативное).</li><li><b>Организация</b> - создание структуры, распределение задач, полномочий и ответственности, делегирование.</li><li><b>Мотивация</b> - побуждение себя и других к деятельности для достижения целей. Именно мотивация определяет удовлетворенность персонала и эффективность труда.</li><li><b>Контроль</b> - сопоставление достигнутого с планами. Виды: предварительный, текущий, заключительный. Этапы: установление стандартов → измерение результатов → корректировка.</li><li><b>Координация</b> - обеспечение согласованности и слаженности работы отдельных подразделений и исполнителей (центральная «связующая» функция).</li></ul><p><b>Связующие процессы</b>: коммуникации и принятие решений.</p><p><b>Функции управления</b> - специализированные виды управленческой деятельности, отличающиеся однородностью содержания выполняемых работ и их целевой направленностью.</p><p>Уровни управления (пирамида):</p><ul><li>Высший (институциональный, топ-менеджмент) - стратегия, миссия, взаимодействие с внешней средой (директор, правление).</li><li>Средний (управленческий) - тактика, руководство функциональными подразделениями (начальники цехов, отделов).</li><li>Низовой (технический, первичный) - оперативное управление исполнителями (мастера, бригадиры). Чем выше уровень - тем больше доля планирования и меньше оперативного контроля.</li></ul>","m":1},{"id":"1.3","s":"1","t":"Руководитель: качества, роли. Власть и влияние","h":"<p>Роли руководителя по Г. Минцбергу (10 ролей, 3 группы):</p><ul><li><b>Межличностные</b>: главный руководитель (символическая глава), лидер, связующее звено.</li><li><b>Информационные</b>: приемник информации, распространитель, представитель.</li><li><b>Роли, связанные с принятием решений</b>: предприниматель, устраняющий нарушения, распределитель ресурсов, ведущий переговоры.</li></ul><p><b>Качества руководителя</b>: профессиональные (компетентность, опыт), деловые (организаторские способности, ответственность, инициативность), личные (честность, стрессоустойчивость, коммуникабельность).</p><p><b>Власть</b> - возможность влиять на поведение других людей. Влияние - поведение одного лица, которое вносит изменения в поведение другого.</p><p>Формы власти (Дж. Френч и Б. Рейвен):</p><ol><li>Власть, основанная на принуждении (страх).</li><li>Власть, основанная на вознаграждении.</li><li>Экспертная власть (вера в знания руководителя).</li><li>Эталонная власть (харизма, пример).</li><li>Законная (легитимная, традиционная) власть - на основе должности.</li></ol><p><b>Понятие баланса власти</b>: руководитель зависит от подчиненных так же, как они от него.</p>","m":1},{"id":"1.4","s":"1","t":"Мотивация. Управление группами","h":"<p><b>Потребность</b> - ощущение недостатка в чем-либо, имеющее определенную направленность. Мотив - внутреннее побуждение к действию. Стимул - внешний рычаг воздействия. Вознаграждение - все то, что человек считает для себя ценным (внутреннее - от самой работы; внешнее - зарплата, карьера, признание).</p><p>Содержательные теории мотивации (что мотивирует - потребности):</p><ul><li><b>А. Маслоу</b> - иерархия из 5 уровней, снизу вверх: 1) физиологические → 2) безопасность и защищенность → 3) социальные (причастность) → 4) уважение и признание → 5) самовыражение (самоактуализация). Потребность высшего уровня активируется после удовлетворения низших.</li><li>К. <b>Альдерфер (ERG)</b>: существование, связь, рост.</li><li>Д. <b>МакКлелланд</b>: потребности власти, успеха (достижения), причастности.</li><li>Ф. <b>Герцберг (двухфакторная)</b>: гигиенические факторы (условия, зарплата, политика фирмы - их отсутствие вызывает недовольство, но они не мотивируют) и мотиваторы (успех, признание, содержание работы, рост).</li></ul><p>Процессуальные теории (как возникает мотивация - процесс):</p><ul><li>Теория ожиданий В. <b>Врума</b>: мотивация = (затраты → результат) × (результат → вознаграждение) × валентность (ценность вознаграждения).</li><li>Теория справедливости Дж. <b>Адамса</b>: люди сравнивают свое вознаграждение/усилия с другими.</li><li><b>Модель Портера-Лоулера</b>: комплексная (усилия, способности, результат, вознаграждение, удовлетворение); результативный труд ведет к удовлетворению.</li></ul><p><b>Группы</b>: формальные (командные, рабочие/целевые, комитеты) и неформальные (возникают спонтанно, лидер неформальный). Факторы эффективности группы: размер (оптимум 5-9 человек), состав, групповые нормы, сплоченность, конфликтность, статус и роли членов (целевые и поддерживающие роли).</p><p><b>Коммуникации (сквозная тема)</b>: вертикальные - по нисходящей (приказы вниз) и по восходящей (отчеты вверх); горизонтальные - обмен информацией между подразделениями одного уровня; формальные и неформальные (слухи).</p><p><b>Конфликты</b>: функциональные (полезные - «вскрывают» важные проблемы, дают альтернативы) и дисфункциональные. Виды: внутриличностный, межличностный, личность-группа, межгрупповой. Методы разрешения: уклонение, сглаживание, принуждение, компромисс, сотрудничество (решение проблемы).</p>","m":1},{"id":"1.5","s":"1","t":"Корпорация как объект управления","h":"<p><b>Корпорация</b> - объединение капиталов (обычно акционерное общество) с отделением собственности (акционеры) от управления (наемный менеджмент); юридическое лицо с ограниченной ответственностью участников.</p><p><b>Органы управления АО</b>: общее собрание акционеров (высший орган) → совет директоров (наблюдательный совет - общее руководство) → исполнительный орган (генеральный директор/правление - текущее управление); ревизионная комиссия.</p><p><b>Корпоративное управление</b> - система взаимоотношений между менеджментом, советом директоров, акционерами и иными заинтересованными сторонами (стейкхолдерами).</p><p><b>Основные ориентиры управления корпорацией</b>: рост стоимости бизнеса (капитализации), баланс интересов стейкхолдеров, дивидендная политика, прозрачность и раскрытие информации, защита прав акционеров (в т.ч. миноритарных), социальная ответственность.</p>","m":1},{"id":"1.6","s":"1","t":"Лидерство. Теории лидерства","h":"<p><b>Лидерство</b> - способность влиять на отдельных людей и группы, направляя их усилия на достижение целей организации. Руководитель - формальный статус; лидер может быть неформальным.</p><p>Три подхода к лидерству:</p><ol><li>Теория личностных качеств («великих людей») - лидерами рождаются; поиск универсального набора качеств (не подтвердился).</li><li><b>Поведенческий подход</b> - важен стиль поведения:<ul><li>Стили К. Левина: авторитарный, демократический, либеральный (попустительский).</li><li>Д. МакГрегор: теория X (люди ленивы - нужно принуждение) и теория Y (труд естественен - нужно доверие).</li><li>4 системы Р. Лайкерта (от эксплуататорско-авторитарной до основанной на участии).</li><li><b>Управленческая решетка Блейка-Моутон</b>: оси «забота о производстве» и «забота о людях»; стили: 1.1 - обедненное управление, 9.1 - власть-подчинение (задача), 1.9 - «загородный клуб», 5.5 - середина пути, 9.9 - командное управление (идеал).</li></ul></li><li><b>Ситуационный подход</b>:<ul><li><b>Модель Фидлера</b>: стиль (на задачу / на отношения, шкала НПК - наименее предпочитаемый коллега) + благоприятность ситуации (отношения лидер-подчиненные, структура задачи, должностные полномочия).</li><li><b>Херси-Бланшар</b>: стиль зависит от «зрелости» исполнителей: указывающий → убеждающий → участвующий → делегирующий.</li><li><b>Митчелл-Хаус «путь-цель»</b>: лидер помогает подчиненным достичь целей (стили: поддержки, инструментальный, участия, ориентированный на достижение).</li><li><b>Врум-Йеттон</b>: 5 стилей принятия решений от автократического (AI) до группового (GII) в зависимости от ситуации.</li></ul></li></ol>","m":1},{"id":"2.1","s":"2","t":"Понятие и проблемы стратегического управления","h":"<p><b>Стратегическое управление</b> - управление, которое опирается на человеческий потенциал как основу организации, ориентирует деятельность на запросы потребителей, гибко реагирует на изменения среды и проводит своевременные изменения, обеспечивая конкурентные преимущества и выживание в долгосрочной перспективе (О. Виханский).</p><p><b>Эволюция</b>: бюджетирование → долгосрочное планирование (экстраполяция) → стратегическое планирование → стратегическое управление (с 1970-80-х, И. Ансофф).</p><p><b>Отличие от оперативного управления</b>: взгляд вовне и в долгосрочную перспективу, персонал - ценность, эффективность = своевременность реакции на изменения среды.</p><p><b>Актуальные проблемы стратегического управления в России</b>: высокая неопределенность и нестабильность среды; короткий горизонт планирования; формальный подход (стратегия «на бумаге»); разрыв между стратегией, бюджетом и мотивацией; дефицит информации и квалифицированных стратегов; сопротивление изменениям. Пути решения: сценарное планирование, гибкие (адаптивные) стратегии, вовлечение персонала, сбалансированная система показателей (BSC Каплана-Нортона).</p>","m":1},{"id":"2.2","s":"2","t":"Понятие стратегии и классификации","h":"<p><b>Стратегия</b> - долгосрочное, качественно определенное направление развития организации; генеральный план действий по достижению целей. «5П» Минцберга: план, прием (уловка), паттерн (принцип поведения), позиция, перспектива.</p><p><b>Уровни стратегий</b>: корпоративная (портфельная) → деловая (конкурентная, бизнес-стратегия) → функциональные (маркетинговая, производственная, финансовая, кадровая) → операционные.</p><p>Эталонные (базисные) стратегии развития (4 группы - частый вопрос):</p><ol><li><b>Концентрированного роста</b>: усиление позиции на рынке; развитие рынка (новые рынки для старого продукта); развитие продукта (новый продукт на старом рынке).</li><li><b>Интегрированного роста</b>: обратная вертикальная интеграция (контроль над поставщиками); вперед идущая вертикальная интеграция (контроль над сбытом); горизонтальная интеграция (поглощение конкурентов).</li><li><b>Диверсифицированного роста</b>: центрированная (новые продукты на базе существующего производства); горизонтальная (новые продукты по новой технологии для старого рынка); конгломеративная (новое, не связанное с прежним).</li><li><b>Сокращения</b>: ликвидация; «сбор урожая»; сокращение (продажа подразделения); сокращение расходов.</li></ol><p>Конкурентные стратегии М. <b>Портера</b>: лидерство по издержкам; дифференциация; фокусирование (на издержках или дифференциации в узком сегменте).</p>","m":1},{"id":"2.3","s":"2","t":"Методологические подходы к формированию стратегии","h":"<p><b>Процесс стратегического управления (этапы)</b>: анализ среды → определение миссии и целей → выбор стратегии → выполнение стратегии → оценка и контроль выполнения.</p><ul><li><b>Миссия</b> - смысл существования организации, ее предназначение. Цели - конкретное состояние отдельных характеристик, к которому стремится организация (требования SMART: конкретность, измеримость, достижимость, релевантность, сроки).</li><li><b>Анализ макроокружения</b>: PEST(STEP)-анализ - политические, экономические, социальные, технологические факторы.</li><li><b>Анализ непосредственного окружения</b>: модель 5 конкурентных сил Портера - действующие конкуренты, потенциальные новички, товары-заменители, поставщики, покупатели.</li><li><b>Анализ внутренней среды</b>: SNW-анализ (сильные, нейтральные, слабые стороны), цепочка ценности Портера, управленческое обследование функциональных зон.</li><li><b>SWOT-анализ</b> - сопоставление сильных и слабых сторон (внутреннее) с возможностями и угрозами (внешнее).</li></ul><p>10 школ стратегий по Минцбергу (дизайна, планирования, позиционирования, предпринимательства, когнитивная, обучения, власти, культуры, внешней среды, конфигурации) - достаточно знать сам факт классификации.</p>","m":1},{"id":"2.4","s":"2","t":"СЕБ, портфель предприятия и портфельный анализ","h":"<p>Стратегическая единица бизнеса (СЕБ, SBU) - внутрифирменное подразделение (направление деятельности), отвечающее за стратегию в определенном сегменте рынка. Признаки: свой рынок и круг потребителей, свои конкуренты, самостоятельность в принятии стратегических решений, свой руководитель, ответственный за прибыль.</p><p><b>Портфель предприятия</b> - совокупность СЕБ (направлений бизнеса) одного владельца.</p><p><b>Портфельный анализ</b> - инструмент оценки сбалансированности портфеля и распределения ресурсов между СЕБ. Цели: согласовать стратегии СЕБ, распределить ресурсы, сбалансировать денежные потоки (доноры/потребители), обосновать реструктуризацию. Этапы: 1) выделение СЕБ; 2) оценка привлекательности рынков и конкурентоспособности СЕБ; 3) построение и анализ матриц; 4) разработка стратегии для каждой СЕБ и портфеля в целом.</p><p>Матрица БКГ (рост рынка / относительная доля рынка):</p><ul><li><b>«Звезды»</b> - высокий рост, высокая доля (инвестировать);</li><li><b>«Дойные коровы»</b> - низкий рост, высокая доля (источник средств, «сбор урожая»);</li><li>«Трудные дети» («знаки вопроса», «дикие кошки») - высокий рост, низкая доля (инвестировать или уходить);</li><li><b>«Собаки»</b> - низкий рост, низкая доля (сокращать/ликвидировать).</li></ul><p><b>Другие матрицы</b>: GE/McKinsey (привлекательность отрасли × конкурентная позиция, 3x3), ADL (стадия жизненного цикла), матрица Ансоффа «продукт-рынок» (проникновение на рынок, развитие рынка, развитие товара, диверсификация).</p>","m":1},{"id":"2.5","s":"2","t":"Стратегический потенциал предприятия","h":"<p><b>Стратегический потенциал</b> - совокупность ресурсов и возможностей (компетенций) предприятия, определяющая его способность разрабатывать и реализовывать стратегию, достигать стратегических целей.</p><p><b>Составляющие</b>: производственно-технологический, кадровый, финансовый, инновационный, маркетинговый, организационно-управленческий, информационный потенциал.</p><p><b>Методы определения/оценки</b>: SWOT- и SNW-анализ; экспертные оценки (балльные, взвешенные); ресурсный подход (в т.ч. VRIO-анализ: ценность, редкость, неимитируемость, организованность); анализ цепочки ценности; сравнительный (бенчмаркинг); стоимостные методы (оценка активов и компетенций).</p>","m":1},{"id":"2.6","s":"2","t":"Производственные стратегии предприятия","h":"<p><b>Производственная стратегия</b> - функциональная стратегия: долгосрочная программа действий в сфере создания и реализации продукта (мощности, технологии, качество, размещение, персонал, запасы).</p><p>Основные решения/виды:</p><ul><li><b>По удовлетворению спроса</b>: полное удовлетворение спроса (максимальные запасы), производство по среднему уровню спроса, производство по нижнему уровню (дефицит покрывается запасами/субподрядом), производство на заказ.</li><li><b>По производственным мощностям</b>: наращивание, поддержание, сокращение; размещение мощностей.</li><li><b>По процессам</b>: сфокусированные на процессе (единичное/мелкосерийное), сфокусированные на продукте (массовое), повторяющиеся процессы.</li><li>Стратегии в области качества, вертикальной интеграции, гибкости производства, НИОКР. Производственная стратегия должна поддерживать конкурентную стратегию (лидерство по издержкам → массовое стандартизированное производство; дифференциация → гибкость и качество).</li></ul>","m":1},{"id":"3.1","s":"3","t":"Структура и содержание системы управления организацией (СУО)","h":"<p><b>Система управления организацией</b> - совокупность взаимосвязанных элементов (подсистем), обеспечивающих процесс управления для достижения целей.</p><p><b>Базовое деление</b>: управляющая подсистема (субъект управления) - аппарат управления, и управляемая подсистема (объект управления) - производство, персонал. Связаны прямой связью (команды) и обратной связью (информация о состоянии).</p><p>Структура СУО (по Р. Фатхутдинову) - 4 подсистемы + внешняя среда:</p><ol><li><b>Целевая - цели</b>: качество, ресурсосбережение, рынок сбыта, развитие производства, социальное развитие, экология.</li><li><b>Обеспечивающая</b> - методическое, ресурсное, информационное, правовое обеспечение.</li><li>Управляемая (функциональная) - управление процессами: НИОКР, планирование, подготовка производства, производство, маркетинг, сбыт.</li><li><b>Управляющая</b> - управление персоналом, разработка и реализация управленческих решений. Плюс подсистема научного сопровождения (научные подходы, принципы, методы).</li></ol>","m":1},{"id":"3.2","s":"3","t":"Основы инновационной деятельности организации","h":"<p>Новшество (новация) - оформленный результат исследований и разработок (новый метод, изобретение, документ). Инновация (нововведение) - конечный результат внедрения новшества, дающий экономический, социальный или иной эффект; внедренное новшество.</p><p><b>Классификация инноваций</b>: продуктовые и процессные; по глубине - базисные (радикальные), улучшающие, псевдоинновации (модификации); технологические, организационные, управленческие, маркетинговые, социальные.</p><p><b>Инновационный процесс</b>: фундаментальные исследования → прикладные исследования → опытно-конструкторские разработки (НИОКР/ОКР) → освоение производства → коммерциализация → диффузия (распространение) инновации.</p><p><b>Жизненный цикл инновации</b>: зарождение → рост → зрелость → спад. Источники финансирования: собственные средства, бюджет, кредиты, венчурный капитал. Инновационная инфраструктура: технопарки, бизнес-инкубаторы, венчурные фонды.</p>","m":1},{"id":"3.3","s":"3","t":"Управление качеством","h":"<p><b>Качество</b> - совокупность характеристик объекта, относящихся к его способности удовлетворять установленные и предполагаемые потребности (потребности человека в соответствии с назначением). Качество - это НЕ просто «отсутствие брака».</p><p>Система показателей качества продукции:</p><ul><li>показатели назначения (функциональные);</li><li><b>надежности</b>: безотказность, долговечность, ремонтопригодность, сохраняемость;</li><li>технологичности (трудоемкость, материалоемкость изготовления);</li><li>стандартизации и унификации;</li><li>эргономические; эстетические; транспортабельности;</li><li>патентно-правовые; экологические; безопасности;</li><li>экономические (цена потребления).</li></ul><p><b>Управление качеством</b>: концепция TQM (всеобщее управление качеством) - ориентация на потребителя, лидерство руководства, вовлечение персонала, процессный подход, постоянное улучшение, принятие решений на основе фактов. Цикл Деминга PDCA (Plan-Do-Check-Act). Стандарты ИСО серии 9000 (системы менеджмента качества), сертификация. «Петля качества» - жизненный цикл продукции от маркетинга до утилизации.</p><p><b>7 инструментов контроля качества</b>: контрольный листок; гистограмма; диаграмма Парето (правило 80/20 - выделение главных причин); диаграмма Исикавы (причинно-следственная, «рыбий скелет»); диаграмма рассеяния (корреляция); стратификация (расслоение данных); контрольные карты Шухарта (статистический контроль процесса).</p><p><b>Организация контроля качества</b>: входной (материалы), операционный (в процессе), приемочный (готовая продукция); сплошной и выборочный; статистические методы приемочного контроля; служба ОТК.</p>","m":1},{"id":"3.4","s":"3","t":"Управление ресурсосбережением. Показатели эффективности. Логистика","h":"<p><b>Ресурсосбережение</b> - деятельность по рациональному использованию материальных, энергетических, трудовых ресурсов (снижение расхода на единицу продукции без потери качества).</p><p><b>Показатели</b>: материалоемкость (материальные затраты / выпуск), материалоотдача (обратный), энергоемкость, коэффициент использования материала (чистая масса детали / норма расхода), удельный вес отходов, вторичное использование.</p><p><b>Показатели эффективности деятельности организации</b>: производительность труда (выработка, трудоемкость), фондоотдача, оборачиваемость оборотных средств, рентабельность (продаж, активов, продукции), затраты на 1 руб. товарной продукции.</p><p><b>Логистика</b> - управление материальными и сопутствующими (информационными, финансовыми) потоками от источника сырья до конечного потребителя с минимальными затратами. Функциональные области: закупочная, производственная, распределительная (сбытовая), транспортная, складская, управление запасами, информационная. Функции логистики в ресурсосбережении: оптимизация запасов (модель EOQ - оптимальный размер заказа, системы «точно в срок» JIT, канбан), сокращение потерь при транспортировке и хранении, оптимизация маршрутов, снижение совокупных затрат в цепи поставок.</p>","m":1},{"id":"3.5","s":"3","t":"Основы организации производства","h":"<p><b>Производственный процесс</b> - совокупность взаимосвязанных процессов труда и естественных процессов по превращению сырья в готовую продукцию.</p><p><b>Виды производственных процессов</b>: основные (изменение предмета труда - заготовительная, обрабатывающая, сборочная стадии), вспомогательные (создают условия: ремонт, инструмент, энергия), обслуживающие (транспорт, склад, контроль).</p><p><b>Принципы организации производства</b>: специализация, пропорциональность, параллельность, прямоточность, непрерывность, ритмичность, автоматичность, гибкость.</p><p><b>Типы производства</b>: единичное, серийное (мелко-, средне-, крупносерийное), массовое. Различаются номенклатурой, повторяемостью, специализацией рабочих мест (коэффициент закрепления операций), себестоимостью.</p><p><b>Производственный цикл</b> - время от запуска сырья до выхода готовой продукции (рабочий период + естественные процессы + перерывы). Виды движения предметов труда: последовательный, параллельный, параллельно-последовательный.</p><p><b>Производственная структура</b> - состав производственных подразделений и их взаимосвязи: цех → участок → рабочее место. Типы: технологическая (по однородности операций), предметная (по изделиям), смешанная (предметно-технологическая).</p><p>Организационные структуры управления (ОСУ):</p><ul><li><b>Иерархические (бюрократические)</b>: линейная (единоначалие, подчинение линейному руководителю по всем вопросам), функциональная (подчинение функциональным руководителям по группам проблем), линейно-функциональная (штабная) - самая распространенная, дивизиональная (продуктовая, региональная, ориентированная на потребителя).</li><li><b>Органические (адаптивные)</b>: матричная (двойное подчинение: линейному и руководителю проекта), проектная, бригадная (кросс-функциональная). Линейные связи - подчинение по всем вопросам одному руководителю; функциональные связи - подчинение по определенным группам проблем функциональному руководителю.</li></ul>","m":1},{"id":"3.6","s":"3","t":"Экономическая безопасность предприятия","h":"<p><b>Экономическая безопасность</b> - состояние защищенности предприятия от внутренних и внешних угроз, при котором обеспечивается устойчивое функционирование и развитие, эффективное использование ресурсов.</p><p><b>Функциональные составляющие</b>: финансовая, кадровая (интеллектуальная), технико-технологическая, информационная, правовая, силовая (физическая защита), экологическая, рыночная.</p><p><b>Угрозы</b>: внешние (недобросовестная конкуренция, рейдерство, кризисы, криминал) и внутренние (утечка информации, хищения, некомпетентность, конфликты). Инструменты: служба экономической безопасности, режим коммерческой тайны, проверка контрагентов, внутренний контроль и аудит, индикаторы безопасности (пороговые значения финансовых коэффициентов).</p>","m":1},{"id":"4.1","s":"4","t":"Банкротство как объективное явление рыночной экономики","h":"<p>Банкротство (несостоятельность) - признанная арбитражным судом неспособность должника в полном объеме удовлетворить требования кредиторов по денежным обязательствам и (или) исполнить обязанность по уплате обязательных платежей. Регулируется ФЗ № 127-ФЗ от 26.10.2002 «О несостоятельности (банкротстве)».</p><p><b>Признаки банкротства юридического лица</b>: обязательства не исполнены в течение 3 месяцев с даты, когда должны были быть исполнены; минимальная сумма требований:</p><ul><li>по действующей редакции закона (с 29.05.2024, ФЗ-107) - не менее 2 млн руб. (для сельскохозяйственных, стратегических предприятий и субъектов естественных монополий - 3 млн руб.);</li><li><b>ВАЖНО</b>: в учебниках и старых тестах (в т.ч. в примерном билете 2019 г.) фигурирует прежний порог - 300 тыс. руб. (а до 2015 г. - 100 тыс. руб.). Для граждан - 500 тыс. руб. Если вопрос по старой программе - вероятный ожидаемый ответ 300 тыс. руб.; если спросят «по действующему законодательству» - 2 млн руб.</li></ul><p><b>Виды банкротства</b>: реальное; техническое (временное - вызвано просрочкой дебиторки, активы превышают долги); преднамеренное (умышленное, уголовно наказуемо); фиктивное (ложное объявление).</p><p><b>Банкротство - объективный рыночный механизм</b>: выводит с рынка неэффективные предприятия, перераспределяет ресурсы, защищает кредиторов, стимулирует финансовую дисциплину. Причины: внешние (экономические, политические, демографические) и внутренние (неэффективный менеджмент, устаревшие технологии, высокие затраты, ошибочная стратегия).</p><p><b>Фазы экономического цикла (последовательность!)</b>: кризис → депрессия → оживление → подъем.</p>","m":1},{"id":"4.2","s":"4","t":"Диагностика финансового кризиса предприятия","h":"<p><b>Диагностика</b> - система целевого финансового анализа для выявления кризисного состояния. Виды: экспресс-диагностика (по стандартной отчетности) и фундаментальная (углубленная, факторная, прогнозная).</p><p><b>Стадии кризиса</b>: легкий финансовый кризис → глубокий → финансовая катастрофа (банкротство).</p><p><b>Ключевые индикаторы</b>: коэффициент текущей ликвидности (норматив ≥ 2), коэффициент обеспеченности собственными оборотными средствами (≥ 0,1), коэффициенты восстановления/утраты платежеспособности, структура баланса, динамика прибыли и денежных потоков, доля просроченной задолженности.</p><p><b>Зарубежные модели прогнозирования банкротства</b>:</p><ul><li>Z-счет Альтмана (2-факторная и 5-факторная). Пятифакторная: Z &lt; 1,8 - вероятность банкротства очень высокая; 1,81-2,99 - зона неопределенности; Z &gt; 2,99 - низкая.</li><li>Модель У. Бивера (система коэффициентов, гл. - отношение денежного потока к долгам);</li><li>модели Таффлера, Лиса. <b>Отечественные модели</b>: Сайфуллина-Кадыкова (рейтинговое число R), модель О. Зайцевой, модель Иркутской ГЭА (R-модель).</li></ul>","m":1},{"id":"4.3","s":"4","t":"Организационно-правовые процедуры банкротства (по ФЗ-127)","h":"<ol><li>Наблюдение (до 7 месяцев) - временный управляющий; анализ финансового состояния, обеспечение сохранности имущества, реестр требований кредиторов, первое собрание кредиторов. Руководство сохраняет полномочия с ограничениями.</li><li>Финансовое оздоровление (до 2 лет) - административный управляющий; график погашения задолженности, восстановление платежеспособности без отстранения руководства.</li><li>Внешнее управление (18 месяцев + продление до 6) - внешний управляющий (руководство отстраняется); мораторий на удовлетворение требований кредиторов; план внешнего управления (перепрофилирование, продажа части имущества, взыскание дебиторки).</li><li>Конкурсное производство (6 месяцев, продлевается) - конкурсный управляющий; цель - соразмерное удовлетворение требований кредиторов; формирование конкурсной массы, продажа имущества, расчеты по очередности, ликвидация должника.</li><li><b>Мировое соглашение</b> - возможно на любой стадии; утверждается судом; прекращает дело о банкротстве. Досудебные меры: санация (финансовая помощь собственников/кредиторов до возбуждения дела).</li></ol>","m":1},{"id":"4.4","s":"4","t":"Стратегия и тактика антикризисного управления","h":"<p>Антикризисное управление (АКУ) - управление, в котором предвидение опасности кризиса, анализ его симптомов и факторов, разработка мер по снижению отрицательных последствий кризиса и использование его факторов для последующего развития поставлены определенным образом.</p><p><b>Стратегия АКУ - долгосрочное направление</b>: предупреждение кризиса, подготовка к нему, противодействие, стабилизация, выход из кризиса, использование кризиса для обновления.</p><p><b>Тактика АКУ</b>:</p><ul><li><b>защитная</b> - сокращение расходов, закрытие убыточных подразделений, сокращение персонала, продажа активов, отсрочка платежей;</li><li><b>наступательная</b> - модернизация, обновление продукции, выход на новые рынки, реорганизация, активный маркетинг, привлечение инвестиций.</li></ul><p><b>Механизмы финансовой стабилизации</b>: оперативный (устранение неплатежеспособности - «отсечение лишнего»), тактический (восстановление финансовой устойчивости), стратегический (обеспечение финансового равновесия в длительном периоде, модель устойчивого роста).</p>","m":1},{"id":"4.5","s":"4","t":"Виды антикризисных стратегий предприятия","h":"<ul><li>Стратегия восстановления (разворота) - концентрация на основном бизнесе, смена руководства, жесткий контроль затрат.</li><li><b>Стратегия поворота</b>: изменение цен, переориентация на другие сегменты, разработка нового товара, рационализация ассортимента.</li><li><b>Стратегия выхода</b>: изъятие инвестиций (продажа бизнеса/подразделения), «сбор урожая», ликвидация.</li><li>Стратегия сокращения расходов (экономии).</li><li>Превентивные (предупреждения кризиса) и реактивные стратегии; стратегии сокращения, стабилизации, роста после кризиса.</li></ul>","m":1},{"id":"5.1","s":"5","t":"Производственная структура и производственный процесс","h":"<p>См. также п. 3.5 (пересекающаяся тема). Дополнительно: <b>Факторы, формирующие производственную структуру</b>: отраслевая принадлежность и характер продукции, масштаб производства, уровень специализации и кооперирования, технологии, формы организации производства (концентрация, специализация, кооперирование, комбинирование).</p><p>Показатели продукции (важно для теста):</p><ul><li>Товарная продукция (ТП) - стоимость готовой продукции, работ и услуг, предназначенных к реализации.</li><li>Валовая продукция (ВП) = ТП + (НЗПкон - НЗПнач) - товарная продукция плюс изменение остатков незавершенного производства. То есть ВП отличается от ТП на величину изменения остатков незавершенного производства.</li><li>Реализованная продукция (выручка) = ТП + (Остатки ГП на складе нач - кон).</li><li><b>Внутризаводской оборот</b> - продукция, потребляемая внутри предприятия (в валовую продукцию по заводскому методу не включается).</li></ul>","m":1},{"id":"5.2","s":"5","t":"Производственная мощность предприятия","h":"<p>Производственная мощность (ПМ) - максимально возможный годовой выпуск продукции при полном использовании оборудования и площадей, прогрессивных нормах и технологии.</p><p><b>Расчет</b>: М = N × Фэф / t, где N - число единиц оборудования, Фэф - эффективный (действительный) годовой фонд времени единицы оборудования, t - трудоемкость единицы продукции. Фэф = число рабочих дней × число смен × длительность смены × (1 - плановые простои %).</p><p>Виды: <b>входная (на начало года), выходная (на конец), среднегодовая</b>: Мср = Мнач + Мвв × n/12 - Мвыб × m/12 (n - число полных месяцев работы введенных мощностей до конца года, m - число месяцев, в течение которых выбывшие мощности не работают).</p><p>Коэффициент использования мощности = фактический выпуск / среднегодовая мощность (&lt; 1).</p><p><b>Пути улучшения использования</b>: экстенсивные - увеличение времени работы (сокращение простоев, повышение коэффициента сменности, снижение доли недействующего оборудования); интенсивные - увеличение выработки в единицу времени (модернизация, новые технологии, приобретение более производительного оборудования - это интенсивный, а НЕ экстенсивный резерв).</p>","m":1},{"id":"5.3","s":"5","t":"Имущество предприятия, его состав и источники формирования","h":"<p><b>Имущество</b> - материальные и нематериальные активы предприятия. Состав: внеоборотные активы (нематериальные активы, основные средства, незавершенное строительство, долгосрочные финансовые вложения) и оборотные активы (запасы, НДС, дебиторская задолженность, краткосрочные финансовые вложения, денежные средства).</p><p><b>Источники формирования</b>: собственные (уставный капитал, добавочный, резервный капитал, нераспределенная прибыль, амортизационные отчисления) и заемные/привлеченные (кредиты банков, займы, кредиторская задолженность).</p><p>Основные фонды (ОФ) - средства труда, многократно участвующие в производственном процессе, сохраняющие натуральную форму и переносящие стоимость на продукцию по частям (через амортизацию). Производственные/непроизводственные; активная часть (машины, оборудование) и пассивная (здания, сооружения). В состав ОПФ не включается оборудование на складе готовой продукции (это товар/запасы, не введено в эксплуатацию).</p><ul><li><b>Оценка</b>: первоначальная, восстановительная, остаточная, ликвидационная стоимость.</li><li><b>Износ</b>: физический и моральный (1-го рода - удешевление воспроизводства; 2-го рода - появление более производительной техники).</li><li><b>Амортизация</b> - процесс перенесения стоимости ОФ на себестоимость продукции. Способы: линейный, уменьшаемого остатка, по сумме чисел лет полезного использования, пропорционально объему продукции.</li><li><b>Показатели</b>: фондоотдача = Выручка / среднегодовая стоимость ОПФ; фондоемкость (обратный); фондовооруженность = ОПФ / численность; Кобновления = ОФвведенные / ОФконец года; Квыбытия = ОФвыбывшие / ОФначало года; коэффициенты экстенсивного, интенсивного, интегрального использования; коэффициент сменности.</li></ul><p>Оборотные средства (оборотный капитал) - часть капитала, которая участвует в производственном цикле ОДИН раз, полностью переносит свою стоимость на себестоимость продукции и меняет натуральную форму; выступает в виде производственных запасов, незавершенного производства, дебиторской задолженности, денежных средств.</p><ul><li><b>Оборотные производственные фонды</b>: производственные запасы (сырье, основные и вспомогательные материалы, покупные полуфабрикаты, топливо, тара, запчасти), незавершенное производство и полуфабрикаты собственного производства, расходы будущих периодов.</li><li><b>Фонды обращения</b>: готовая продукция на складе и отгруженная, дебиторская задолженность, денежные средства, краткосрочные финансовые вложения.</li><li>Нормируемые (запасы, НЗП, РБП, ГП на складе) и ненормируемые.</li><li>Коэффициент оборачиваемости = Выручка (объем реализации) / средний остаток (норматив) оборотных средств; длительность одного оборота = 360 (или 365/90/30) / Коб. Ускорение оборачиваемости высвобождает средства (абсолютное и относительное высвобождение).</li></ul>","m":2},{"id":"5.4","s":"5","t":"Классификация затрат. Смета и калькуляция","h":"<p><b>Себестоимость</b> - выраженные в денежной форме текущие затраты на производство и реализацию продукции.</p><p>По экономическим элементам (5 элементов) - для составления сметы затрат на производство (сколько и каких ресурсов израсходовано в целом по предприятию, независимо от вида продукции):</p><ol><li>материальные затраты; 2) затраты на оплату труда; 3) отчисления на социальные нужды (страховые взносы); 4) амортизация; 5) прочие затраты.</li></ol><p><b>По статьям калькуляции</b> - для расчета себестоимости единицы конкретного вида продукции и определения цены. Типовые статьи: сырье и материалы; возвратные отходы (вычитаются); покупные полуфабрикаты и комплектующие; топливо и энергия на технологические цели; основная зарплата производственных рабочих; дополнительная зарплата; отчисления на социальные нужды; расходы на подготовку и освоение производства; общепроизводственные (цеховые) расходы; общехозяйственные расходы; потери от брака; прочие производственные; коммерческие (внепроизводственные) расходы.</p><ul><li>Цеховая себестоимость → + общехозяйственные и прочие = производственная → + коммерческие = полная себестоимость.</li></ul><p><b>Другие классификации</b>: прямые (относятся на конкретный продукт) и косвенные (распределяются: общепроизводственные, общехозяйственные); простые (одноэлементные - сырье, зарплата) и комплексные (состоят из нескольких элементов - цеховые/общепроизводственные, общехозяйственные расходы); условно-постоянные и переменные (по отношению к объему производства); основные и накладные.</p><p><b>Методы учета затрат</b>: нормативный (по нормам и отклонениям); попередельный - в непрерывных краткосрочных технологических процессах, состоящих из последовательных стадий-переделов (металлургия, химия, пищевая промышленность); позаказный (единичное, мелкосерийное производство, по заказам); попроцессный (простой).</p>","m":1},{"id":"5.5","s":"5","t":"Взаимоотношения предприятия с финансово-кредитной системой","h":"<p><b>Институты</b>: Центральный банк (регулятор), коммерческие банки (расчетно-кассовое обслуживание, кредитование, депозиты, валютные операции), страховые компании, инвестиционные и пенсионные фонды, лизинговые и факторинговые компании, биржи, бюджетная система (налоги, субсидии), внебюджетные фонды (страховые взносы).</p><p><b>Кредит - принципы</b>: возвратность, срочность, платность, обеспеченность, целевой характер, дифференцированность. Лизинг - долгосрочная аренда имущества с возможным выкупом (финансовый и оперативный). Факторинг - продажа дебиторской задолженности. Финансовые ресурсы предприятия имеют денежную форму.</p>","m":1},{"id":"5.6","s":"5","t":"Дополнительно: кадры, оплата труда, цена, прибыль, инвестиции (встречается в тесте)","h":"<p><b>Кадры (персонал) - категории</b>: рабочие (основные и вспомогательные), руководители, специалисты, служащие - работники преимущественно умственного труда, обеспечивающие управление производством (учет, контроль, оформление документов).</p><ul><li><b>Списочная численность</b> - численность работников списочного состава на определенную дату с учетом принятых и уволенных на эту дату; явочная - фактически явившиеся; среднесписочная - средняя за период.</li><li><b>Производительность труда</b>: выработка = выпуск / численность (или время); трудоемкость - обратный показатель.</li></ul><p><b>Формы оплаты труда - две</b>: сдельная и повременная (остальное - системы).</p><ul><li><b>Сдельные системы</b>: прямая сдельная, сдельно-премиальная, сдельно-прогрессивная, косвенно-сдельная, аккордная.</li><li><b>Повременные системы</b>: простая повременная, повременно-премиальная, окладная.</li><li><b>Тарифная система</b>: тарифные ставки, сетки, разряды, ТКС.</li></ul><p><b>Цена</b>: структура = себестоимость + прибыль (+ акциз для подакцизных + НДС + снабженческо-сбытовые и торговые наценки). Рентабельность - НЕ элемент цены (это относительный показатель). Виды цен: оптовые, розничные, свободные, регулируемые.</p><p><b>Прибыль</b>: валовая = выручка - себестоимость; прибыль от продаж = валовая - коммерческие - управленческие расходы; прибыль до налогообложения; чистая прибыль. Фактическая прибыль = разница между доходами и издержками отчетного периода (не «активы минус пассивы»!). Рентабельность (относительный показатель эффективности): продукции = прибыль / полная себестоимость; продаж = прибыль от продаж / выручка; активов = прибыль / средняя стоимость активов; рентабельность оборотных активов = прибыль (чистая) / средняя стоимость оборотных активов; собственного капитала = чистая прибыль / СК.</p><p>Инвестиции и капитальные вложения. В состав капитальных вложений входят: затраты на строительно-монтажные работы, приобретение оборудования, инструмента, инвентаря, проектно-изыскательские работы, природоохранные объекты. НЕ входят: сырье, основные и вспомогательные материалы, комплектующие (это оборотные средства).</p><ul><li><b>Необходимость оценки эффективности инвестпроектов</b> - определение экономической целесообразности вложений и сравнение альтернативных вариантов.</li><li>Срок окупаемости (PB) - период, за который первоначальные вложения покрываются суммарными результатами (доходами) от осуществления проекта.</li><li>NPV (ЧДД) - чистый дисконтированный доход: сумма дисконтированных денежных потоков минус инвестиции; проект эффективен при NPV &gt; 0. IRR (ВНД) - ставка, при которой NPV = 0. PI - индекс доходности (&gt; 1 - эффективен). Дисконтирование - приведение будущих денег к текущему моменту.</li></ul><p><b>Стратегический план предприятия</b> - совокупность главных целей предприятия и основных способов их достижения (а не просто «план на 5-10 лет»).</p>","m":2},{"id":"6.1","s":"6","t":"Сущность, цель, задачи и функции бухгалтерского учета","h":"<p><b>Бухгалтерский учет</b> - упорядоченная система сбора, регистрации и обобщения информации в денежном выражении об имуществе (активах), обязательствах организации и их движении путем сплошного, непрерывного и документального учета всех хозяйственных операций. Регулируется ФЗ № 402-ФЗ «О бухгалтерском учете».</p><p><b>Цель</b> - формирование полной и достоверной информации о деятельности организации и ее имущественном положении для внутренних и внешних пользователей. Задачи: формирование информации; контроль за соблюдением законодательства и использованием ресурсов; предотвращение отрицательных результатов; выявление внутрихозяйственных резервов. Функции: информационная, контрольная, аналитическая, обеспечения сохранности имущества, обратной связи.</p><p><b>Виды хозяйственного учета</b>: оперативный, статистический, бухгалтерский (в нем - финансовый, управленческий, налоговый учет). Измерители: натуральные, трудовые, денежный (обобщающий). Элементы метода бухучета: документация, инвентаризация, оценка, калькуляция, счета, двойная запись, бухгалтерский баланс, отчетность.</p>","m":1},{"id":"6.2","s":"6","t":"Организация бухгалтерского учета","h":"<p>Ответственность за организацию учета несет руководитель; ведение - главный бухгалтер (или аутсорсинг). Формы ведения: бухгалтерская служба, штатный бухгалтер, специализированная организация, лично руководителем (для малых).</p><p><b>Учетная политика</b> - принятая организацией совокупность способов ведения бухучета. Этапы формирования учетной политики (типовой ответ на открытый вопрос):</p><ol><li><b>подготовительный</b> - анализ законодательства (ФСБУ/ПБУ) и специфики деятельности;</li><li>выбор и обоснование способов учета по разделам: организационно-технический (рабочий план счетов, формы первичных документов, график документооборота, порядок инвентаризации, порядок контроля) и методический (способы амортизации, оценки запасов, признания доходов/расходов и т.д.);</li><li>оформление и утверждение приказом руководителя (до начала отчетного года);</li><li>применение (последовательно из года в год) и контроль, внесение изменений при необходимости.</li></ol><p><b>Бухгалтерский баланс</b> - способ обобщения имущества по составу (актив) и источникам (пассив) на дату; Актив = Пассив.</p><ul><li><b>Актив</b>: раздел I «Внеоборотные активы» (НМА, основные средства...), раздел II «Оборотные активы». Статьи актива располагаются по возрастанию ликвидности: нематериальные активы → основные средства → запасы → дебиторская задолженность → краткосрочные финансовые вложения → денежные средства (частый вопрос на последовательность).</li><li><b>Пассив</b>: III «Капитал и резервы», IV «Долгосрочные обязательства», V «Краткосрочные обязательства». Формы отчетности: баланс, отчет о финансовых результатах, отчет об изменениях капитала, отчет о движении денежных средств, пояснения. Двойная запись: каждая операция отражается по дебету одного и кредиту другого счета в одинаковой сумме. Счета: активные, пассивные, активно-пассивные.</li></ul>","m":1},{"id":"6.3","s":"6","t":"Сущность экономического анализа. Виды анализа","h":"<p>Экономический анализ (АХД) - способ познания хозяйственных процессов: комплексное изучение деятельности предприятия с целью объективной оценки результатов, выявления резервов и обоснования управленческих решений.</p><p><b>Виды анализа</b>:</p><ul><li><b>по времени</b>: предварительный (перспективный, прогнозный), оперативный (текущий), последующий (ретроспективный, итоговый);</li><li><b>по субъектам</b>: внутренний и внешний;</li><li><b>по содержанию</b>: финансовый, управленческий, технико-экономический, маркетинговый, инвестиционный, функционально-стоимостной (ФСА);</li><li><b>по охвату</b>: комплексный и тематический (локальный).</li></ul>","m":1},{"id":"6.4","s":"6","t":"Принципы и методы экономического анализа","h":"<p><b>Принципы</b>: научность, системность, комплексность, объективность (достоверность), действенность, регулярность (систематичность), оперативность, эффективность, государственный подход.</p><p><b>Методы</b>:</p><ul><li><b>традиционные</b>: сравнение, абсолютные/относительные/средние величины, группировка, графический, табличный, балансовый;</li><li><b>факторный анализ (детерминированный)</b>: метод цепных подстановок, абсолютных и относительных разниц, индексный, интегральный;</li><li><b>стохастический</b>: корреляционно-регрессионный анализ;</li><li>экономико-математические методы, эвристические (экспертные). Характерные черты: изучение причинно-следственных связей, измерение влияния факторов, поиск резервов.</li></ul>","m":1},{"id":"6.5","s":"6","t":"Информационное обеспечение анализа","h":"<p><b>Источники</b>: плановые (планы, нормативы, сметы), учетные (данные бухгалтерского, статистического, оперативного учета и отчетности, первичная документация), внеучетные (законы, договоры, аудиторские заключения, материалы проверок, СМИ, маркетинговая информация). Требования к информации: достоверность, оперативность, сопоставимость, полнота, рациональность (экономичность).</p>","m":1},{"id":"6.6","s":"6","t":"Ключевые финансовые коэффициенты (для вопросов на соответствие)","h":"<p>Ликвидность (способность погашать краткосрочные обязательства, КО):</p><ul><li>абсолютной ликвидности = (денежные средства + КФВ) / КО; норматив ≥ 0,2 (в ряде учебников допускается ≥ 0,1);</li><li>критической (быстрой, промежуточной) ликвидности = (ДС + КФВ + дебиторка) / КО; норматив ≥ 1 (допускается 0,7-1);</li><li>текущей ликвидности = оборотные активы / КО; норматив ≥ 2.</li></ul><p>Финансовая устойчивость (структура капитала):</p><ul><li>коэффициент автономии (финансовой независимости) = собственный капитал / валюта баланса; норматив ≥ 0,5;</li><li>коэффициент соотношения заемных и собственных средств (финансовый леверидж) ≤ 1;</li><li>коэффициент обеспеченности собственными оборотными средствами ≥ 0,1; коэффициент маневренности СК.</li></ul><p>Деловая активность (оборачиваемость):</p><ul><li>коэффициент оборачиваемости капитала (активов) = выручка / средняя величина активов;</li><li>оборачиваемости дебиторской / кредиторской задолженности, запасов; периоды оборота в днях. Запомнить для соответствия: «автономия» и «соотношение собственных и заемных» - это финансовая устойчивость; «оборачиваемость» (любая) - это деловая активность.</li></ul><p><b>Рентабельность</b>: продаж, активов, собственного капитала, продукции (см. п. 5.6).</p>","m":1},{"id":"7.1","s":"7","t":"Понятие, значение, функции и типология управленческих решений","h":"<p>Управленческое решение (УР) - выбор альтернативы, осуществленный руководителем в рамках его должностных полномочий и компетенции, направленный на достижение целей организации; результат управленческого труда.</p><p><b>Функции УР</b>:</p><ul><li><b>направляющая</b> - решение принимается исходя из долговременной стратегии развития организации;</li><li><b>координирующая</b> - согласование действий исполнителей, частей и элементов управляемой системы;</li><li><b>мотивирующая</b> - согласование интересов каждого члена организации (мобилизация персонала).</li></ul><p><b>Типология УР</b>:</p><ul><li><b>по повторяемости</b>: традиционные (встречавшиеся ранее в практике управления) и нетипичные (новаторские);</li><li>запрограммированные (по алгоритму) и незапрограммированные;</li><li><b>по способу принятия</b>: интуитивные, основанные на суждениях (опыте), рациональные (на основе анализа);</li><li><b>по сроку</b>: стратегические, тактические, оперативные;</li><li><b>по числу ЛПР</b>: единоличные, коллегиальные, коллективные;</li><li><b>по степени определенности среды</b>: в условиях определенности, риска, неопределенности.</li></ul><p><b>Требования к УР</b>: обоснованность, своевременность, полномочность (правомочность), законность, непротиворечивость (согласованность с ранее принятыми), конкретность (адресность), эффективность, простота формы и ясность содержания.</p>","m":1},{"id":"7.2","s":"7","t":"Лицо, принимающее решение (ЛПР)","h":"<p><b>ЛПР</b> - субъект (индивид или группа), который осуществляет выбор альтернативы и несет ответственность за принятое решение и его последствия. Роль ЛПР: постановка целей, определение критериев, окончательный выбор, организация исполнения. ЛПР опирается на владельцев проблемы, экспертов, аналитиков (консультантов), но ответственность лежит на нем. Индивидуальные качества ЛПР (склонность к риску, опыт, ценности) влияют на решение - отсюда уравновешенные, импульсивные, инертные, рискованные, осторожные решения.</p>","m":1},{"id":"7.3","s":"7","t":"Основные этапы процесса принятия управленческого решения","h":"<p>Классическая (рациональная) последовательность:</p><ol><li>диагностика проблемы (анализ ситуации, выявление и формулировка проблемы);</li><li>формулировка ограничений и критериев принятия решения;</li><li>выявление (разработка) альтернатив;</li><li>оценка альтернатив (по критериям, с учетом рисков);</li><li>выбор альтернативы (принятие решения);</li><li>согласование и утверждение;</li><li>реализация решения (организация исполнения);</li><li>контроль и обратная связь (оценка результатов, корректировка).</li></ol>","m":1},{"id":"7.4","s":"7","t":"Анализ внешней среды и ее влияние на решения","h":"<p><b>Среда прямого воздействия (микросреда)</b>: поставщики, потребители, конкуренты, посредники, законы и государственные органы, профсоюзы. Среда косвенного воздействия (макросреда): состояние экономики, политические и правовые факторы, научно-технический прогресс, социокультурные и демографические факторы, международное окружение, природные условия.</p><p><b>Характеристики внешней среды</b>: взаимосвязанность факторов, сложность, подвижность (изменчивость), неопределенность.</p><p><b>Влияние на решения</b> - через условия принятия:</p><ul><li><b>определенность</b> - результат каждой альтернативы известен;</li><li><b>риск</b> - результаты не определены, но вероятности известны;</li><li><b>неопределенность</b> - вероятности оценить невозможно. Инструменты анализа: PEST, SWOT, мониторинг, прогнозирование, сценарный анализ.</li></ul>","m":1},{"id":"7.5","s":"7","t":"Методы и модели принятия управленческих решений","h":"<p><b>Методы</b>:</p><ul><li>аналитические и статистические; экономико-математические (линейное и динамическое программирование, транспортная задача);</li><li><b>экспертные методы</b>: мозговой штурм, метод Дельфи (анонимные многотуровые опросы экспертов), метод комиссий, метод сценариев, метод 635, ранжирование и балльные оценки;</li><li>активизирующие (эвристические), метод аналогий.</li></ul><p><b>Модели</b>:</p><ul><li>платежная матрица (матрица решений) - выбор по ожидаемым значениям с учетом вероятностей;</li><li><b>дерево решений</b> - графическая модель последовательных решений и случайных событий;</li><li>теория игр (поведение конкурентов);</li><li>модели теории очередей (массового обслуживания);</li><li>модели управления запасами (формула Уилсона EOQ - оптимальный размер заказа);</li><li>имитационное моделирование; сетевое планирование (СПУ: графики, критический путь - методы CPM, PERT); анализ безубыточности.</li></ul><p><b>Критерии выбора в условиях неопределенности</b>:</p><ul><li><b>Вальда (максимин) - пессимизм</b>: лучший из худших исходов;</li><li><b>максимакс</b> - оптимизм;</li><li><b>Гурвица</b> - взвешивание пессимизма-оптимизма (коэффициент альфа);</li><li>Сэвиджа (минимакс сожаления) - минимизация максимального риска/упущенной выгоды;</li><li><b>Лапласа</b> - все состояния среды равновероятны.</li></ul>","m":1},{"id":"8","s":"8","t":"Формулы-шпаргалка для расчетных задач","h":"<ol class=\"formulas\"><li><b>Среднегодовая стоимость ОПФ</b>: Фср = Фнач + СУММ(Фвв × n / 12) - СУММ(Фвыб × m / 12), где n - полных месяцев эксплуатации введенных фондов до конца года, m - месяцев отсутствия выбывших. (Ввод в марте → работает с апреля, n = 9; выбытие в июне → не работает с июля, m = 6; ввод в ноябре → n = 1.)</li><li>Фондоотдача = Выручка / Фср. Фондоемкость = 1 / фондоотдача. Кобн = Фвв / Фкон.года; Квыб = Фвыб / Фнач.года.</li><li><b>Оборачиваемость</b>: Коб = Выручка (реализация) / средний остаток оборотных средств; Длительность оборота = 360 / Коб. (Пример: 25 / 7,5 = 3,33 оборота; 360 / 3,33 = 108 дней.)</li><li><b>Производственная мощность</b>: Фэф = Дни × Смены × Часы × (1 - простои); М = (N станков × Фэф) / t на изделие; Кисп = Выпуск / М.</li><li><b>Полная себестоимость изделия (калькуляция)</b>: Материалы + Покупные полуфабрикаты - Возвратные отходы + Топливо/энергия технол. + ЗПосн + ЗПдоп + Отчисления + ОПР (% от ЗПосн) + ОХР (% от ЗПосн) = производственная себестоимость; + Коммерческие (% от производственной) = полная.</li><li>Затраты на 1 руб. товарной продукции = Себестоимость ТП / ТП. Отсюда: ТП = Себестоимость / затраты на 1 руб.; плановая себестоимость = ТПплан × затраты на 1 руб. план.</li><li><b>Ставка роялти (при передаче лицензии/ноу-хау)</b>: R = (Рентабельность × Доля лицензиара) / (1 + Рентабельность). Пример: (0,25 × 0,1) / 1,25 = 0,02 = 2 %.</li><li>Точка безубыточности (шт.) = Постоянные затраты / (Цена - Переменные затраты на ед.).</li><li>NPV = СУММ(CFt / (1 + r)^t) - Инвестиции; PI = дисконтированные доходы / инвестиции; PB = инвестиции / среднегодовой денежный поток (простой срок окупаемости).</li><li>Прибыль от продаж = Выручка - Себестоимость - Коммерческие - Управленческие. Рентабельность продукции = Прибыль / Себестоимость × 100 %.</li><li>Коэффициент восстановления платежеспособности = [Ктл.кон + 6/Т × (Ктл.кон - Ктл.нач)] / 2 (норматив ≥ 1).</li><li><b>Z-счет Альтмана (5-факторный, ориентиры)</b>: Z &lt; 1,8 - высокая вероятность банкротства; Z &gt; 2,99 - низкая.</li></ol>","m":2},{"id":"9","s":"9","t":"Быстрые факты для запоминания (частые ловушки теста)","h":"<ul><li>Валовая продукция = товарная + изменение остатков незавершенного производства.</li><li><b>Качество</b> - способность удовлетворять потребности, а не «отсутствие брака».</li><li><b>Приобретение нового более производительного оборудования</b> - ИНТЕНСИВНЫЙ резерв (не экстенсивный).</li><li>Оборотные фонды переносят стоимость на продукцию ПОЛНОСТЬЮ за один цикл; основные - по частям.</li><li><b>Формы оплаты труда</b> - только сдельная и повременная; аккордная и окладная - системы.</li><li><b>Смета затрат</b> - по экономическим элементам (по предприятию в целом); калькуляция - по статьям (на единицу конкретной продукции).</li><li><b>Комплексные статьи</b> - цеховые (общепроизводственные), общехозяйственные расходы; простые - сырье, зарплата, топливо.</li><li><b>Попередельный метод</b> - непрерывные краткие техпроцессы со стадиями-переделами.</li><li><b>В структуру цены входят</b>: себестоимость, прибыль, косвенные налоги (НДС, акциз); рентабельность - не входит.</li><li>Финансовые ресурсы имеют денежную форму.</li><li><b>Мотивация</b> - функция, определяющая удовлетворенность персонала; координация - слаженность работы подразделений.</li><li><b>Обмен информацией между отделами</b> - горизонтальные коммуникации.</li><li><b>Лучшая оценка делового конфликта</b> - «вскрывает важные проблемы».</li><li><b>Порядок фаз цикла</b>: кризис → депрессия → оживление → подъем.</li><li><b>Порядок потребностей Маслоу (возрастание)</b>: физиологические → безопасность → социальные → уважение → самовыражение.</li><li><b>Актив баланса</b> - по возрастанию ликвидности: НМА → ОС → запасы → дебиторка → КФВ → деньги.</li><li><b>Нормативы ликвидности</b>: текущая ≥ 2; критическая ≥ 1; абсолютная ≥ 0,2 (0,1).</li><li><b>Порог банкротства юрлица</b>: по старым учебникам - 300 тыс. руб.; по действующему закону (с 29.05.2024) - 2 млн руб.; просрочка - 3 месяца.</li><li><b>Традиционные решения</b> - встречавшиеся ранее в практике управления.</li><li><b>Капвложения</b>: СМР + оборудование/инструмент/инвентарь; сырье и материалы - НЕ капвложения.</li></ul>","m":1}]};

function list(){

  var qq=q.trim().toLowerCase().replace(/ё/g,'е');

        (whole?'':'<div class="ttl">'+esc(s.t)+'</div>')+
        '<div class="card rows">'+arts.map(function(a){return row(a,esc(a.t));}).join('')+'</div></section>';
    }).join('');

  }
  var res=[];

    var bi=a.pl.indexOf(qq,tl);if(bi<0)bi=-1;
    if(bi>=0){var p=bi-tl,s=Math.max(0,p-50),e=Math.min(a.p.length,p+qq.length+80);if(s>0){var sp=a.p.indexOf(' ',s);if(sp>-1&&sp<p)s=sp+1;}if(e<a.p.length){var ep=a.p.lastIndexOf(' ',e);if(ep>p+qq.length)e=ep;}
      snip=(s>0?'…':'')+hl(a.p.slice(s,e),qq)+(e<a.p.length?'…':'');}
    res.push({a:a,c:cnt,s:snip});
  });
  if(!res.length){el.innerHTML='<div class="empty">Ничего не нашлось по запросу «'+esc(q.trim())+'»</div>';return;}
  el.innerHTML='<section class="sec"><h2>Найдено в '+res.length+' '+pl(res.length,'статье','статьях','статьях')+'</h2><div class="card rows res">'+
    res.map(function(r){return row(r.a,hl(r.a.t,qq)+(r.s?'<small>'+r.s+'</small>':'')).replace('href="#/a/'+r.a.id+'"','href="#/a/'+r.a.id+'?find='+encodeURIComponent(q.trim())+'"');}).join('')+'</div></section>';
}
function pl(n,a,b,c){var m=n%10,h=n%100;return m===1&&h!==11?a:(m>=2&&m<=4&&(h<12||h>14)?b:c);}
function hl(text,qq){
  var low=text.toLowerCase().replace(/ё/g,'е'),out='',i=0,j;
  while((j=low.indexOf(qq,i))>=0){out+=esc(text.slice(i,j))+'<mark>'+esc(text.slice(j,j+qq.length))+'</mark>';i=j+qq.length;}
  return out+esc(text.slice(i));
}

function markIn(root,q){
  var qq=q.toLowerCase().replace(/ё/g,'е'),w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),n,first=null;
  while(n=w.nextNode()){
    var low=n.nodeValue.toLowerCase().replace(/ё/g,'е'),i=low.indexOf(qq);if(i<0)continue;
    var r=document.createRange();r.setStart(n,i);r.setEnd(n,i+qq.length);var mk=document.createElement('mark');mk.className='flash';
    r.surroundContents(mk);if(!first)first=mk;w.currentNode=mk;
  }
  setTimeout(function(){[].forEach.call(root.querySelectorAll('mark.flash'),function(m){m.replaceWith(document.createTextNode(m.textContent));});root.normalize();},2600);
  return first;
}

(function(){var cur=null,sx=0,sy=0;
  function sp(el){if(!el._sp)el._sp=new Spring(1,function(v){el.style.transform=v===1?'':'scale('+v+')';},{response:.3});return el._sp;}
  document.addEventListener('pointerdown',function(e){var el=e.target.closest('.press');if(!el)return;cur=el;sx=e.clientX;sy=e.clientY;sp(el).set(.97);},{passive:true});
  function up(){if(cur){sp(cur).set(1);cur=null;}}
